; OPcache tuning for MediaWiki, mounted into /usr/local/etc/php/conf.d/.
;
; The mediawiki image ships opcache-recommended.ini with the generic PHP
; defaults, which are too small for MediaWiki: max_accelerated_files=4000
; against ~8400 PHP files in the tree, so most of the codebase is recompiled
; from source on every request. conf.d files load in alphabetical order, so
; this file is named to sort after opcache-recommended.ini and win.
;
; Check the real numbers from inside the container with:
;   opcache_get_status()['opcache_statistics']

; Rounded up internally to the next value in OPcache's prime table (16229).
opcache.max_accelerated_files=10000

; MediaWiki plus extensions does not fit in the default 128M.
opcache.memory_consumption=256

opcache.interned_strings_buffer=16

; Keep timestamp validation on: LocalSettings.php is a bind mount that gets
; edited in place, and a 60s revalidation window is cheap enough.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
